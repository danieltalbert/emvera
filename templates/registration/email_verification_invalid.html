{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification link unavailable — Emvera</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<main class="auth-main" style="min-height:100vh;">
  <div class="auth-form-wrap">
    <h1 class="auth-form-title">That link is invalid or expired</h1>
    <p class="auth-form-subtitle">Request a new verification email and try again.</p>
    <a class="btn btn-primary btn-full" href="{% url 'accounts:verification_sent' %}">Request a new link</a>
  </div>
</main>
</body>
</html>
