{% extends 'base.html' %}
{% block content %}
<h2>Choose a New Password</h2>
{% if validlink %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Update Password</button>
  </form>
{% else %}
  <p>This password reset link is invalid or has expired.</p>
  <a href="{% url 'accounts:password_reset' %}" class="btn btn-secondary">Request a New Link</a>
{% endif %}
{% endblock %}
