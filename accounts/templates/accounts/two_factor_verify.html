{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify sign-in — Emvera</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<main class="auth-main" style="min-height:100vh;">
  <div class="auth-form-wrap">
    <div class="auth-form-header">
      <h1 class="auth-form-title">Verify your sign-in</h1>
      <p class="auth-form-subtitle">Enter the six-digit code from your authenticator app.</p>
    </div>
    {% if messages %}
      {% for message in messages %}<div class="alert alert-{{ message.tags }}">{{ message }}</div>{% endfor %}
    {% endif %}
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="code">Authenticator code</label>
        <input class="form-input" type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Verify and continue</button>
    </form>
    <div class="auth-links"><a href="{% url 'accounts:login' %}">Start sign-in again</a></div>
  </div>
</main>
</body>
</html>
