{% extends 'base.html' %}
{% block content %}
<h1>Two-Factor Authentication Settings</h1>
<p>Current status: {% if user.two_factor_enabled %}Enabled{% else %}Disabled{% endif %}</p>
{% if user.two_factor_enabled %}
    <form method="post">
        {% csrf_token %}
        <button type="submit" name="disable" value="1">Disable 2FA</button>
    </form>
{% else %}
    <a href="{% url 'accounts:two_factor_setup' %}">Setup 2FA</a>
{% endif %}
{% endblock %}
