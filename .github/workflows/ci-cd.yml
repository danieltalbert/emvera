name: CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Emvera uses SQLite, so no database service is needed here.
      DJANGO_SECRET_KEY: test-secret-key-not-for-production
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Django 6.0 requires Python 3.12+.
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --verbosity 2

      - name: Lint — fail only on real errors
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint — style report (non-blocking)
        run: flake8 . --count --exit-zero --statistics
        continue-on-error: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: echo "Add deployment steps here (e.g. Railway, Render, Fly.io, AWS)."
