# Local / demo orchestration for Emvera.
#
# This build uses SQLite (the database configured in core/settings.py), so no
# separate database service is required. nginx terminates HTTP on :80 and
# proxies application traffic to gunicorn, while serving collected static files
# directly from a shared volume. To run a production-grade Postgres instead,
# see DEPLOYMENT.md.
services:
  web:
    build: .
    # migrate is also run by the image CMD; kept here so `docker compose up`
    # works even if the CMD is overridden.
    command: sh -c "python manage.py migrate --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file:
      - .env
    volumes:
      - staticfiles:/app/staticfiles
    expose:
      - "8000"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - staticfiles:/staticfiles:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  staticfiles:
