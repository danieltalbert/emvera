server {
    listen 80;
    server_name localhost;

    # Allow reasonably sized CSV uploads (see data_integration CSV import).
    client_max_body_size 12M;

    # Collected static files are shared from the web image via the
    # `staticfiles` volume mounted at /staticfiles.
    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
